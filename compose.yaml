name: learning-studio

services:
  backend:
    # 双模式:本地开发/构建用 build;CI 发布后可 APP_VERSION=vX.Y.Z docker compose pull 拉取现成镜像
    image: ghcr.io/civilization-os/learning-studio/backend:${APP_VERSION:-latest}
    build:
      context: .
      target: backend
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      APP_STORE_PATH: /app/data/store.json
      APP_DB_PATH: ${APP_DB_PATH:-/app/data/learning-studio.db}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env before starting}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_API_URL: ${TAVILY_API_URL:-https://api.tavily.com/search}
      # 邮件(SMTP)配置。发件邮箱可以是假的/测试 SMTP 站点,邮件进入垃圾箱不影响功能。
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # 连接无有效证书的假 SMTP 站点(如自建 Mailpit/MailHog)时设为 true
      SMTP_ALLOW_INSECURE_TLS: ${SMTP_ALLOW_INSECURE_TLS:-false}
      # 未配置 SMTP 时把验证码回显到页面/日志(测试用),生产对外服务不建议开启
      MAIL_ECHO_CODE: ${MAIL_ECHO_CODE:-false}
    volumes:
      - learning-studio-data:/app/data
    expose:
      - "8787"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  web:
    image: ghcr.io/civilization-os/learning-studio/web:${APP_VERSION:-latest}
    build:
      context: .
      target: web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      # 自签证书(deploy/certs/,用 scripts/gen-selfsigned-cert.mjs 重新生成)
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  learning-studio-data:
